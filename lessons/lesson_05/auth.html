<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auth</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <h1>Auth page</h1>
    <a href="index.html">На главную</a>

    <main>
        <form id="authForm">
            <h2>Вход и регистрация</h2>
            <input type="text" id="authLogin" placeholder="Введите логин" minlength="3" required>
            <input type="password" id="authPassword" placeholder="Введите пароль" minlength="5" required>
            <button type="subbmit" id="loginBtn">
                Логин
            </button>
            <button type="subbmit" id="registerBtn"></buttontype>
                Регистрация
            </button>
            <p id="authMessage"></p>
        </form>
    </main>
    <script src="./js/authPage.js" type="module"></script>
</body>
</html>
