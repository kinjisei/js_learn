<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Online Store</h1>
        <a href="addProduct.html">Добавить продукт</a>
        <button id="favoritesButton">Избранное</button>
        <a href="cartPage.html" class="cart-link">
            Корзина
            <span id="cartCount">0</span>
        </a>
    </header>
    <main>
        <section class="controls">
            <input 
                type="text"
                id="searchInput"
                placeholder="Введите название товара">
            <select id="categorySelect">
                <option value="all">Все категории</option>
            </select>
        </section>
        <p id="message"></p>
        <section id="products" class="products">
        </section>
    </main>

    <div class="modal hidden" id="productModal">
        <div class="modal-content">
            <button id="closeProduct">Закрыть</button>
            <div id="productDetail">
            </div>
        </div>
    </div>
    <div class="modal hidden" id="favoritesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Избранное</h2>
                <button id="closeFavorites">Закрыть</button>
            </div>
            <div id="favoritesItems"></div>
        </div>
    </div>
    <script src="./js/main.js" type="module"></script>
</body>
</html>
