<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="addmovie">
        <h2>Добавление фильма</h2>
        <input type="text" placeholder="Введите название фильма" id="movieNameInput">
        <input type="text" placeholder="Введите жанр фильма" id="movieGenreInput">
        <button type="submit">Добавить</button>
    </form>
    <div id="message"></div>
    <h2>Список фильмов</h2>
    <div id="filter">
        <select id="filterSelect">
            <option value="all">Все</option>
            <option value="watched">Просмотренные</option>
            <option value="not_watched">Не просмотренные</option>
        </select>
        <input type="text" placeholder="Введите название фильма" id="movieNameInputFilter">
        <p id="filtermessage"></p>
    </div>
    <div id="movieList"></div>
    <div id="movieCounter"></div>
    <script src="script.js"></script>
</body>

</html>
