<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="productForm">
        <input type="text" name="title" placeholder="Введите название товара" required>
        <input type="text" name="description" placeholder="Введите описание товара" required>
        <input type="text" name="category" placeholder="Введите название категории" required>
        <input type="number" name="price" placeholder="Введите ценну" required>
        <input type="number" name="quantity" placeholder="Введите количество" required>
        <input type="file" name="image" required>
        <button type="submit" id="addProductBtn">Добавить продукт</button>
    </form>
    <p id="message"></p>

    <script src="./js/addProduct.js" type="module"></script>
</body>
</html>
